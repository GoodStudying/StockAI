<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人ERP管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; }
  header { background: #1f2d3d; color: #fff; padding: 12px 20px; font-size: 18px; }
  .layout { display: flex; gap: 12px; padding: 12px; }
  .panel { background: #fff; border-radius: 8px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #tree-panel { width: 300px; min-height: 80vh; }
  #main-panel { flex: 1; }
  h3 { margin-bottom: 10px; font-size: 15px; color: #333; border-bottom: 2px solid #409eff; padding-bottom: 6px; }
  button { background: #409eff; color: #fff; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #66b1ff; }
  button.danger { background: #f56c6c; }
  button.gray { background: #909399; }
  input, select, textarea { padding: 5px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; }
  .tree-node { padding: 3px 0 3px 4px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 14px; }
  .tree-node:hover { background: #ecf5ff; }
  .tree-node.selected { background: #d9ecff; }
  .tree-node .ops { display: none; margin-left: auto; }
  .tree-node:hover .ops { display: inline; }
  .tree-node .ops button { padding: 1px 6px; font-size: 12px; }
  .indent-1 { margin-left: 0; } .indent-2 { margin-left: 18px; }
  .indent-3 { margin-left: 36px; } .indent-4 { margin-left: 54px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #ebeef5; padding: 6px 8px; text-align: left; }
  th { background: #f5f7fa; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; justify-content: center; align-items: center; z-index: 99; }
  .modal { background: #fff; border-radius: 8px; padding: 20px; width: 520px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 14px; }
  .form-row { display: flex; align-items: center; margin-bottom: 10px; gap: 8px; }
  .form-row label { width: 90px; font-size: 13px; color: #606266; flex-shrink: 0; }
  .form-row input, .form-row select, .form-row textarea { flex: 1; }
  .modal-footer { text-align: right; margin-top: 12px; }
  .modal-footer button { margin-left: 8px; }
  .lcsc-result { border: 1px solid #ebeef5; border-radius: 4px; padding: 8px; margin: 6px 0; font-size: 12px; cursor: pointer; }
  .lcsc-result:hover { background: #ecf5ff; }
  .doc-item { font-size: 12px; color: #409eff; margin-right: 8px; }
  .badge { display: inline-block; background: #ecf5ff; color: #409eff; border-radius: 3px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<header>个人ERP管理系统</header>
<div class="layout">
  <!-- 左侧：仓库树 -->
  <div class="panel" id="tree-panel">
    <h3>仓库结构（最多4级）</h3>
    <div class="toolbar">
      <button onclick="addWarehouse(null)">+ 新建一级库</button>
    </div>
    <div id="tree"></div>
  </div>

  <!-- 右侧：物料 -->
  <div class="panel" id="main-panel">
    <h3 id="mat-title">物料列表</h3>
    <div class="toolbar">
      <input id="search-input" placeholder="按名称 / 编码 / 型号搜索" style="width:220px"
             onkeydown="if(event.key==='Enter')loadMaterials()">
      <button onclick="loadMaterials()">查询</button>
      <button onclick="openMaterialModal()">+ 新建物料</button>
      <button class="gray" onclick="openLcscModal()">从立创商城新建</button>
    </div>
    <table>
      <thead><tr>
        <th>ID</th><th>名称</th><th>编码</th><th>型号</th><th>封装</th>
        <th>品牌</th><th>数量</th><th>所在库</th><th>手册</th><th>操作</th>
      </tr></thead>
      <tbody id="mat-body"></tbody>
    </table>
  </div>
</div>

<!-- 新建/编辑物料弹窗 -->
<div class="modal-mask" id="mat-modal">
  <div class="modal">
    <h3 id="mat-modal-title">新建物料</h3>
    <input type="hidden" id="m-id">
    <div class="form-row"><label>名称 *</label><input id="m-name"></div>
    <div class="form-row"><label>编码</label><input id="m-code" placeholder="如 C25804"></div>
    <div class="form-row"><label>型号</label><input id="m-model"></div>
    <div class="form-row"><label>分类</label><input id="m-category"></div>
    <div class="form-row"><label>封装</label><input id="m-package"></div>
    <div class="form-row"><label>品牌</label><input id="m-brand"></div>
    <div class="form-row"><label>数量</label><input id="m-quantity" type="number" value="0"></div>
    <div class="form-row"><label>单位</label><input id="m-unit" value="个"></div>
    <div class="form-row"><label>所在库</label><select id="m-warehouse"></select></div>
    <div class="form-row"><label>立创链接</label><input id="m-lcsc"></div>
    <div class="form-row"><label>描述</label><textarea id="m-desc" rows="2"></textarea></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('mat-modal')">取消</button>
      <button onclick="saveMaterial()">保存</button>
    </div>
  </div>
</div>

<!-- 立创商城搜索弹窗 -->
<div class="modal-mask" id="lcsc-modal">
  <div class="modal">
    <h3>从立创商城获取物料</h3>
    <div class="form-row">
      <label>关键字</label>
      <input id="lcsc-kw" placeholder="立创编号(C25804) 或 型号"
             onkeydown="if(event.key==='Enter')lcscSearch()">
      <button onclick="lcscSearch()">搜索</button>
    </div>
    <div id="lcsc-results"></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('lcsc-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- 手册上传弹窗 -->
<div class="modal-mask" id="doc-modal">
  <div class="modal">
    <h3>上传手册（物料ID: <span id="doc-mid"></span>）</h3>
    <div class="form-row"><label>类型</label>
      <select id="doc-type">
        <option value="datasheet">数据手册</option>
        <option value="user_manual">用户手册</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-row"><label>文件</label><input type="file" id="doc-file"></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('doc-modal')">取消</button>
      <button onclick="uploadDoc()">上传</button>
    </div>
  </div>
</div>

<script>
let warehouses = [];
let currentWid = null;

// ---------- 通用 ----------
async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { alert(data.error || '操作失败'); throw new Error(data.error); }
  return data;
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }

// ---------- 仓库树 ----------
async function loadWarehouses() {
  warehouses = await api('/api/warehouses');
  renderTree();
  fillWarehouseSelect();
}
function renderTree() {
  const el = document.getElementById('tree');
  el.innerHTML = '';
  const childrenOf = pid => warehouses.filter(w => (w.parent_id || null) === pid);
  function render(list) {
    list.forEach(w => {
      const div = document.createElement('div');
      div.className = `tree-node indent-${w.level}` + (w.id === currentWid ? ' selected' : '');
      div.innerHTML = `<span class="badge">L${w.level}</span><span>${esc(w.name)}</span>
        <span class="ops">
          ${w.level < 4 ? `<button onclick="event.stopPropagation();addWarehouse(${w.id})">+</button>` : ''}
          <button onclick="event.stopPropagation();renameWarehouse(${w.id},'${esc(w.name)}')">改名</button>
          <button class="danger" onclick="event.stopPropagation();delWarehouse(${w.id})">删</button>
        </span>`;
      div.onclick = () => { currentWid = (currentWid === w.id ? null : w.id); renderTree(); loadMaterials(); };
      el.appendChild(div);
      render(childrenOf(w.id));
    });
  }
  render(childrenOf(null));
}
function esc(s) { return String(s).replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&#39;','"':'&quot;'}[c])); }

async function addWarehouse(parentId) {
  const name = prompt(parentId ? '输入子库名称：' : '输入一级库名称：');
  if (!name) return;
  await api('/api/warehouses', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, parent_id: parentId }) });
  loadWarehouses();
}
async function renameWarehouse(id, oldName) {
  const name = prompt('修改库名：', oldName);
  if (!name || name === oldName) return;
  await api(`/api/warehouses/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name }) });
  loadWarehouses();
}
async function delWarehouse(id) {
  if (!confirm('删除该库及其所有子库？（库内物料的库归属将被置空）')) return;
  await api(`/api/warehouses/${id}`, { method: 'DELETE' });
  currentWid = null;
  loadWarehouses(); loadMaterials();
}
function fillWarehouseSelect() {
  const sel = document.getElementById('m-warehouse');
  sel.innerHTML = '<option value="">（未指定）</option>' +
    warehouses.map(w => `<option value="${w.id}">${'　'.repeat(w.level-1)}${esc(w.name)}</option>`).join('');
}

// ---------- 物料 ----------
async function loadMaterials() {
  const q = document.getElementById('search-input').value.trim();
  let url = '/api/materials?';
  if (q) url += `q=${encodeURIComponent(q)}&`;
  if (currentWid) url += `warehouse_id=${currentWid}`;
  const list = await api(url);
  document.getElementById('mat-title').textContent =
    currentWid ? `物料列表（${(warehouses.find(w=>w.id===currentWid)||{}).name || ''}）` : '物料列表';
  const tb = document.getElementById('mat-body');
  tb.innerHTML = list.map(m => `<tr>
    <td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(m.code||'')}</td>
    <td>${esc(m.model||'')}</td><td>${esc(m.package||'')}</td><td>${esc(m.brand||'')}</td>
    <td>${m.quantity} ${esc(m.unit||'')}</td><td>${esc(m.warehouse_name||'')}</td>
    <td>${(m.documents||[]).map(d =>
      `<a class="doc-item" href="/api/documents/${d.id}">${esc(d.file_name)}</a>`).join('')}
      <button style="padding:1px 6px;font-size:12px" onclick="openDocModal(${m.id})">传</button></td>
    <td>
      <button style="padding:2px 8px;font-size:12px" onclick='editMaterial(${JSON.stringify(m)})'>编</button>
      <button class="danger" style="padding:2px 8px;font-size:12px" onclick="delMaterial(${m.id})">删</button>
    </td></tr>`).join('');
}
function openMaterialModal() {
  document.getElementById('mat-modal-title').textContent = '新建物料';
  ['m-id','m-name','m-code','m-model','m-category','m-package','m-brand','m-lcsc','m-desc']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-quantity').value = 0;
  document.getElementById('m-unit').value = '个';
  document.getElementById('m-warehouse').value = currentWid || '';
  openModal('mat-modal');
}
function editMaterial(m) {
  document.getElementById('mat-modal-title').textContent = `编辑物料 #${m.id}`;
  document.getElementById('m-id').value = m.id;
  document.getElementById('m-name').value = m.name || '';
  document.getElementById('m-code').value = m.code || '';
  document.getElementById('m-model').value = m.model || '';
  document.getElementById('m-category').value = m.category || '';
  document.getElementById('m-package').value = m.package || '';
  document.getElementById('m-brand').value = m.brand || '';
  document.getElementById('m-quantity').value = m.quantity || 0;
  document.getElementById('m-unit').value = m.unit || '个';
  document.getElementById('m-warehouse').value = m.warehouse_id || '';
  document.getElementById('m-lcsc').value = m.lcsc_url || '';
  document.getElementById('m-desc').value = m.description || '';
  openModal('mat-modal');
}
async function saveMaterial() {
  const id = document.getElementById('m-id').value;
  const body = {
    name: document.getElementById('m-name').value.trim(),
    code: document.getElementById('m-code').value.trim(),
    model: document.getElementById('m-model').value.trim(),
    category: document.getElementById('m-category').value.trim(),
    package: document.getElementById('m-package').value.trim(),
    brand: document.getElementById('m-brand').value.trim(),
    quantity: +document.getElementById('m-quantity').value || 0,
    unit: document.getElementById('m-unit').value.trim() || '个',
    warehouse_id: document.getElementById('m-warehouse').value || null,
    lcsc_url: document.getElementById('m-lcsc').value.trim(),
    description: document.getElementById('m-desc').value.trim(),
  };
  if (!body.name) { alert('名称必填'); return; }
  if (id) {
    await api(`/api/materials/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  } else {
    await api('/api/materials', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }
  closeModal('mat-modal');
  loadMaterials();
}
async function delMaterial(id) {
  if (!confirm('确认删除该物料？')) return;
  await api(`/api/materials/${id}`, { method: 'DELETE' });
  loadMaterials();
}

// ---------- 立创商城 ----------
function openLcscModal() {
  document.getElementById('lcsc-results').innerHTML = '';
  openModal('lcsc-modal');
}
async function lcscSearch() {
  const kw = document.getElementById('lcsc-kw').value.trim();
  if (!kw) return;
  const box = document.getElementById('lcsc-results');
  box.innerHTML = '搜索中...';
  try {
    const list = await api(`/api/lcsc/search?q=${encodeURIComponent(kw)}`);
    if (!list.length) { box.innerHTML = '未找到结果，请手工新建。'; return; }
    box.innerHTML = '';
    list.forEach(it => {
      const div = document.createElement('div');
      div.className = 'lcsc-result';
      div.innerHTML = `<b>${esc(it.code)}</b> ${esc(it.model)} [${esc(it.brand)}] ${esc(it.package)}<br>
        <span style="color:#909399">${esc(it.category||'')}</span>`;
      div.onclick = () => fillFromLcsc(it);
      box.appendChild(div);
    });
  } catch (e) { box.innerHTML = '搜索失败，请手工新建。'; }
}
function fillFromLcsc(it) {
  closeModal('lcsc-modal');
  openMaterialModal();
  document.getElementById('m-name').value = it.name || it.model;
  document.getElementById('m-code').value = it.code;
  document.getElementById('m-model').value = it.model;
  document.getElementById('m-category').value = it.category || '';
  document.getElementById('m-package').value = it.package || '';
  document.getElementById('m-brand').value = it.brand || '';
  document.getElementById('m-lcsc').value = it.url || '';
  document.getElementById('m-desc').value = it.description || '';
}

// ---------- 手册上传 ----------
function openDocModal(mid) {
  document.getElementById('doc-mid').textContent = mid;
  document.getElementById('doc-file').value = '';
  openModal('doc-modal');
}
async function uploadDoc() {
  const mid = document.getElementById('doc-mid').textContent;
  const file = document.getElementById('doc-file').files[0];
  if (!file) { alert('请选择文件'); return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('doc_type', document.getElementById('doc-type').value);
  const r = await fetch(`/api/materials/${mid}/documents`, { method: 'POST', body: fd });
  const data = await r.json();
  if (!r.ok) { alert(data.error || '上传失败'); return; }
  closeModal('doc-modal');
  loadMaterials();
}

// ---------- 启动 ----------
loadWarehouses().then(loadMaterials);
</script>
</body>
</html>
