<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物料管理 - 个人ERP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav>
  <span class="brand">个人ERP</span>
  <a href="/" class="active">物料 / 出入库</a>
  <a href="/warehouses.html">仓库管理</a>
  <a href="/system.html">系统管理</a>
  <span class="spacer"></span>
  <span id="nav-user"></span>
</nav>

<div class="content">
  <div class="panel">
    <h3>物料查询</h3>
    <div class="toolbar">
      <input id="search-input" placeholder="按名称 / 编码 / 型号搜索" style="width:240px"
             onkeydown="if(event.key==='Enter')loadMaterials()">
      <select id="filter-warehouse" onchange="loadMaterials()"><option value="">全部仓库</option></select>
      <button onclick="loadMaterials()">查询</button>
      <button onclick="openMaterialModal()">新建物料</button>
      <button class="gray" onclick="openLcscModal()">从立创商城新建</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>ID</th><th>名称</th><th>编码</th><th>型号</th><th>封装</th><th>品牌</th>
        <th>库存</th><th>所在库</th><th>手册</th><th>操作</th>
      </tr></thead>
      <tbody id="mat-body"></tbody>
    </table>
    </div>
  </div>

  <div class="panel">
    <h3>出入库流水</h3>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>时间</th><th>物料</th><th>编码</th><th>类型</th><th>数量</th><th>操作人</th><th>备注</th>
      </tr></thead>
      <tbody id="record-body"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- 新建/编辑物料弹窗 -->
<div class="modal-mask" id="mat-modal">
  <div class="modal">
    <h3 id="mat-modal-title">新建物料</h3>
    <input type="hidden" id="m-id">
    <div class="form-row"><label>名称 *</label><input id="m-name"></div>
    <div class="form-row"><label>编码</label><input id="m-code" placeholder="如 C25804"></div>
    <div class="form-row"><label>型号</label><input id="m-model"></div>
    <div class="form-row"><label>分类</label><input id="m-category"></div>
    <div class="form-row"><label>封装</label><input id="m-package"></div>
    <div class="form-row"><label>品牌</label><input id="m-brand"></div>
    <div class="form-row"><label>数量</label><input id="m-quantity" type="number" value="0"></div>
    <div class="form-row"><label>单位</label><input id="m-unit" value="个"></div>
    <div class="form-row"><label>所在库</label><select id="m-warehouse"></select></div>
    <div class="form-row"><label>立创链接</label><input id="m-lcsc"></div>
    <div class="form-row"><label>描述</label><textarea id="m-desc" rows="2"></textarea></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('mat-modal')">取消</button>
      <button onclick="saveMaterial()">保存</button>
    </div>
  </div>
</div>

<!-- 立创商城搜索弹窗 -->
<div class="modal-mask" id="lcsc-modal">
  <div class="modal">
    <h3>从立创商城获取物料</h3>
    <div class="form-row">
      <label>关键字</label>
      <input id="lcsc-kw" placeholder="立创编号(C25804) 或 型号(STM32F103C8T6)"
             onkeydown="if(event.key==='Enter')lcscSearch()">
      <button onclick="lcscSearch()">搜索</button>
    </div>
    <p style="font-size:12px;color:#909399;margin-bottom:8px">
      输入立创编号可直接获取完整详情；输入型号关键字会搜索匹配的编号列表，点击「查看详情」获取完整信息。</p>
    <div id="lcsc-results"></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('lcsc-modal')">关闭</button>
    </div>
  </div>
</div>

<!-- 手册上传弹窗 -->
<div class="modal-mask" id="doc-modal">
  <div class="modal">
    <h3>上传手册（物料ID: <span id="doc-mid"></span>）</h3>
    <div class="form-row"><label>类型</label>
      <select id="doc-type">
        <option value="datasheet">数据手册</option>
        <option value="user_manual">用户手册</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="form-row"><label>文件</label><input type="file" id="doc-file"></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('doc-modal')">取消</button>
      <button onclick="uploadDoc()">上传</button>
    </div>
  </div>
</div>

<!-- 入库/出库弹窗 -->
<div class="modal-mask" id="stock-modal">
  <div class="modal" style="width:400px">
    <h3 id="stock-title">入库</h3>
    <input type="hidden" id="s-mid"><input type="hidden" id="s-op">
    <div class="form-row"><label>物料</label><input id="s-name" disabled></div>
    <div class="form-row"><label>当前库存</label><input id="s-cur" disabled></div>
    <div class="form-row"><label>数量 *</label><input id="s-qty" type="number" min="1" value="1"></div>
    <div class="form-row"><label>备注</label><input id="s-remark"></div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('stock-modal')">取消</button>
      <button onclick="submitStock()">确认提交</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
let warehouses = [];

async function init() {
  const user = await checkLogin();
  if (!user) return;
  warehouses = await api('/api/warehouses');
  fillWarehouseSelects();
  loadMaterials();
  loadRecords();
}
function fillWarehouseSelects() {
  const opts = warehouses.map(w =>
    `<option value="${w.id}">${'　'.repeat(w.level-1)}${esc(w.name)}</option>`).join('');
  document.getElementById('filter-warehouse').innerHTML = '<option value="">全部仓库</option>' + opts;
  document.getElementById('m-warehouse').innerHTML = '<option value="">（未指定）</option>' + opts;
}

// ---------- 物料 ----------
async function loadMaterials() {
  const q = document.getElementById('search-input').value.trim();
  const wid = document.getElementById('filter-warehouse').value;
  let url = '/api/materials?';
  if (q) url += `q=${encodeURIComponent(q)}&`;
  if (wid) url += `warehouse_id=${wid}`;
  const list = await api(url);
  document.getElementById('mat-body').innerHTML = list.map(m => `<tr>
    <td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(m.code||'')}</td>
    <td>${esc(m.model||'')}</td><td>${esc(m.package||'')}</td><td>${esc(m.brand||'')}</td>
    <td>${m.quantity} ${esc(m.unit||'')}</td><td>${esc(m.warehouse_name||'')}</td>
    <td>${(m.documents||[]).map(d =>
      `<a href="/api/documents/${d.id}">${esc(d.file_name)}</a>`).join(' ')}
      <button class="small" onclick="openDocModal(${m.id})">上传手册</button>
      ${m.code ? `<button class="small" onclick="autoFetchDoc(${m.id}, this)">获取手册</button>` : ''}</td>
    <td style="white-space:nowrap">
      <button class="small" onclick="openStock(${m.id},'${esc(m.name)}',${m.quantity},'in')">入库</button>
      <button class="small gray" onclick="openStock(${m.id},'${esc(m.name)}',${m.quantity},'out')">出库</button>
      <button class="small" onclick='editMaterial(${JSON.stringify(m)})'>编辑</button>
      <button class="small danger" onclick="delMaterial(${m.id})">删除</button>
    </td></tr>`).join('');
}
function openMaterialModal() {
  document.getElementById('mat-modal-title').textContent = '新建物料';
  ['m-id','m-name','m-code','m-model','m-category','m-package','m-brand','m-lcsc','m-desc']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-quantity').value = 0;
  document.getElementById('m-unit').value = '个';
  openModal('mat-modal');
}
function editMaterial(m) {
  document.getElementById('mat-modal-title').textContent = `编辑物料 #${m.id}`;
  document.getElementById('m-id').value = m.id;
  document.getElementById('m-name').value = m.name || '';
  document.getElementById('m-code').value = m.code || '';
  document.getElementById('m-model').value = m.model || '';
  document.getElementById('m-category').value = m.category || '';
  document.getElementById('m-package').value = m.package || '';
  document.getElementById('m-brand').value = m.brand || '';
  document.getElementById('m-quantity').value = m.quantity || 0;
  document.getElementById('m-unit').value = m.unit || '个';
  document.getElementById('m-warehouse').value = m.warehouse_id || '';
  document.getElementById('m-lcsc').value = m.lcsc_url || '';
  document.getElementById('m-desc').value = m.description || '';
  openModal('mat-modal');
}
async function saveMaterial() {
  const id = document.getElementById('m-id').value;
  const body = {
    name: document.getElementById('m-name').value.trim(),
    code: document.getElementById('m-code').value.trim(),
    model: document.getElementById('m-model').value.trim(),
    category: document.getElementById('m-category').value.trim(),
    package: document.getElementById('m-package').value.trim(),
    brand: document.getElementById('m-brand').value.trim(),
    quantity: +document.getElementById('m-quantity').value || 0,
    unit: document.getElementById('m-unit').value.trim() || '个',
    warehouse_id: document.getElementById('m-warehouse').value || null,
    lcsc_url: document.getElementById('m-lcsc').value.trim(),
    description: document.getElementById('m-desc').value.trim(),
  };
  if (!body.name) { alert('名称必填'); return; }
  if (id) {
    await api(`/api/materials/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  } else {
    await api('/api/materials', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }
  closeModal('mat-modal');
  loadMaterials();
}
async function delMaterial(id) {
  if (!confirm('确认删除该物料？')) return;
  await api(`/api/materials/${id}`, { method: 'DELETE' });
  loadMaterials();
}

// ---------- 出入库 ----------
function openStock(mid, name, curQty, op) {
  document.getElementById('s-mid').value = mid;
  document.getElementById('s-op').value = op;
  document.getElementById('s-name').value = name;
  document.getElementById('s-cur').value = curQty;
  document.getElementById('s-qty').value = 1;
  document.getElementById('s-remark').value = '';
  document.getElementById('stock-title').textContent = op === 'in' ? '入库' : '出库';
  openModal('stock-modal');
}
async function submitStock() {
  const mid = document.getElementById('s-mid').value;
  const op = document.getElementById('s-op').value;
  const body = { material_id: +mid, quantity: +document.getElementById('s-qty').value,
                 remark: document.getElementById('s-remark').value.trim() };
  await api(`/api/stock/${op}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  closeModal('stock-modal');
  loadMaterials(); loadRecords();
}
async function loadRecords() {
  const list = await api('/api/stock/records');
  document.getElementById('record-body').innerHTML = list.map(r => `<tr>
    <td>${r.created_at}</td><td>${esc(r.material_name)}</td><td>${esc(r.material_code||'')}</td>
    <td><span class="badge ${r.type}">${r.type === 'in' ? '入库' : '出库'}</span></td>
    <td>${r.quantity}</td><td>${esc(r.operator||'')}</td><td>${esc(r.remark||'')}</td></tr>`).join('');
}

// ---------- 立创商城 ----------
function openLcscModal() {
  document.getElementById('lcsc-results').innerHTML = '';
  document.getElementById('lcsc-kw').value = '';
  openModal('lcsc-modal');
}
async function lcscSearch() {
  const kw = document.getElementById('lcsc-kw').value.trim();
  if (!kw) return;
  const box = document.getElementById('lcsc-results');
  box.innerHTML = '<p style="color:#909399;font-size:13px">搜索中，请稍候...</p>';
  try {
    const list = await api(`/api/lcsc/search?q=${encodeURIComponent(kw)}`);
    if (!list.length) {
      box.innerHTML = '<p style="color:#909399;font-size:13px">未找到结果，请换关键字或直接手工新建。</p>';
      return;
    }
    box.innerHTML = '';
    list.forEach(it => box.appendChild(makeLcscCard(it)));
  } catch (e) {
    box.innerHTML = '<p style="color:#909399;font-size:13px">搜索失败，请手工新建。</p>';
  }
}
function makeLcscCard(it) {
  const div = document.createElement('div');
  div.className = 'lcsc-card';
  const hasDetail = !!(it.model || it.name);
  div.innerHTML = `
    ${it.image ? `<img src="${esc(it.image)}" onerror="this.style.display='none'">` : ''}
    <div class="info">
      <div class="model">${esc(it.model || it.code)}</div>
      <div class="meta">${esc(it.code)}${it.brand ? ' · ' + esc(it.brand) : ''}${it.package ? ' · ' + esc(it.package) : ''}${it.stock ? ' · 库存' + esc(it.stock) : ''}${it.price ? ' · $' + esc(it.price) : ''}</div>
      ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ''}
    </div>
    <div class="pick">
      ${hasDetail ? '' : `<button class="small" onclick="loadLcscDetail('${it.code}', this)">查看详情</button>`}
      <button class="small" onclick='fillFromLcsc(${JSON.stringify(it)})'>选中新建</button>
    </div>`;
  return div;
}
async function loadLcscDetail(code, btn) {
  const card = btn.closest('.lcsc-card');
  btn.disabled = true;
  btn.textContent = '获取中...';
  try {
    const it = await api(`/api/lcsc/detail?code=${encodeURIComponent(code)}`);
    const div = makeLcscCard(it);
    card.replaceWith(div);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '查看详情';
  }
}
function fillFromLcsc(it) {
  closeModal('lcsc-modal');
  openMaterialModal();
  document.getElementById('m-name').value = it.name || it.model || it.code;
  document.getElementById('m-code').value = it.code;
  document.getElementById('m-model').value = it.model;
  document.getElementById('m-category').value = it.category || '';
  document.getElementById('m-package').value = it.package || '';
  document.getElementById('m-brand').value = it.brand || '';
  document.getElementById('m-lcsc').value = it.url || '';
  document.getElementById('m-desc').value = it.description || '';
}

// ---------- 手册上传 / 自动获取 ----------
function openDocModal(mid) {
  document.getElementById('doc-mid').textContent = mid;
  document.getElementById('doc-file').value = '';
  openModal('doc-modal');
}
async function uploadDoc() {
  const mid = document.getElementById('doc-mid').textContent;
  const file = document.getElementById('doc-file').files[0];
  if (!file) { alert('请选择文件'); return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('doc_type', document.getElementById('doc-type').value);
  const r = await fetch(`/api/materials/${mid}/documents`, { method: 'POST', body: fd });
  const data = await r.json();
  if (!r.ok) { alert(data.error || '上传失败'); return; }
  closeModal('doc-modal');
  loadMaterials();
}
async function autoFetchDoc(mid, btn) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '下载中...';
  try {
    const data = await api(`/api/materials/${mid}/fetch_datasheet`, { method: 'POST' });
    alert(data.note ? `手册已存在：${data.file_name}` : `手册已下载：${data.file_name}`);
    loadMaterials();
  } catch (e) {
    btn.textContent = old;
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
