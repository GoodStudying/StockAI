<script src="/common.js"></script>
<script>
/* 尽早应用主题，防止刷新时闪回默认配色 */
(function(){var t=localStorage.getItem('theme');if(t&&t!=='classic')document.documentElement.setAttribute('data-theme',t);})();
/* 首屏鉴权门：渲染前先隐藏整页，checkLogin 鉴权通过后由 common.js 显示（未登录不闪首页）；
   兜底 6s 超时自动显示，防接口异常导致页面永远空白 */
document.documentElement.classList.add('auth-pending');
setTimeout(function(){document.documentElement.classList.remove('auth-pending');}, 6000);
</script>

<link rel="stylesheet" href="/style.css">

    <h1>物料管理</h1>
    <span class="sub">新建 / 编辑 / 删除物料，管理手册与图片</span>

    <h3 class="pt">物料清单</h3>

      <select id="group-by" onchange="setGroup(this.value)" title="分组条件">

<script src="/common.js"></script>
<script>
let warehouses = [];
let allRows = [];   // 接口原始数据缓存：排序/分组/筛选全部在前端对它计算

/* ---------- Excel 式视图状态（持久化 localStorage，重开页面保持） ---------- */
const VIEW_KEY = 'matView';
const SORTABLE_FIELDS = [
  ['name','名称'],['code','编码'],['model','型号'],['category','分类'],['package','封装'],
  ['brand','品牌'],['quantity','库存'],['warehouse_name','所在库'],['location_code','位号'],['created_at','新增日期'],
];
const FIELD_LABEL = Object.fromEntries(SORTABLE_FIELDS);
/* colFilters: 数组类=多选（空数组=不筛）；qtyMin/qtyMax=库存区间（null=不限）；
   hasImage/hasDoc=null 不限 / 1 有 / 0 无 */
let sortRules = [];            // [{field, dir:'asc'|'desc'}]
let groupField = '';           // 分组字段，'' = 不分组
let colFilters = { category: [], brand: [], package: [], unit: [],
                   qtyMin: null, qtyMax: null, hasImage: null, hasDoc: null };
let collapsedGroups = new Set();   // 折叠中的组键（仅当前会话记，不持久化——易过期）

/* 视图状态持久化：排序/分组/筛选 三样（折叠状态不存） */
function saveView() {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify({ sortRules, groupField, colFilters }));
  } catch (e) {}
}
function loadView() {
  try {
    const v = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}');
    if (Array.isArray(v.sortRules)) sortRules = v.sortRules.filter(r => FIELD_LABEL[r.field]);
    if (typeof v.groupField === 'string' && ['','warehouse_name','category','brand','package','unit']
        .includes(v.groupField)) groupField = v.groupField;
    if (v.colFilters && typeof v.colFilters === 'object') {
      ['category','brand','package','unit'].forEach(k => {
        if (Array.isArray(v.colFilters[k])) colFilters[k] = v.colFilters[k];
      });
      ['qtyMin','qtyMax','hasImage','hasDoc'].forEach(k => {
        if (v.colFilters[k] !== undefined && v.colFilters[k] !== null) colFilters[k] = v.colFilters[k];
      });
    }
  } catch (e) {}
  const sel = document.getElementById('group-by');
  if (sel) sel.value = groupField;
}

async function init() {
  const user = await checkLogin();
  if (!user) return;
  warehouses = await api('/api/warehouses');
  fillWarehouseSelects();
  loadView();          // 恢复上次视图（排序/分组/筛选）
  loadMaterials();
}
function fillWarehouseSelects() {
  // 深度优先排序：子库紧跟父库，符合树形层级
  const sorted = [];
  const childrenOf = pid => warehouses.filter(w => (w.parent_id || null) === pid);
  (function walk(pid) {
    childrenOf(pid).forEach(w => { sorted.push(w); walk(w.id); });
  })(null);
  const opts = sorted.map(w =>
    `<option value="${w.id}">${'　'.repeat(w.level-1)}${esc(w.name)}</option>`).join('');
  document.getElementById('filter-warehouse').innerHTML = '<option value="">全部仓库</option>' + opts;
  document.getElementById('m-warehouse').innerHTML = '<option value="">（未指定）</option>' + opts;
}

// ---------- 物料 ----------
/* 拉数据（关键字/仓库走后端）→ 缓存 → 前端视图管线 */
async function loadMaterials() {
  const q = document.getElementById('search-input').value.trim();
  const wid = document.getElementById('filter-warehouse').value;
  let url = '/api/materials?';
  if (q) url += `q=${encodeURIComponent(q)}&`;
  if (wid) url += `warehouse_id=${wid}`;
  allRows = await api(url);
  applyView();
}

/* ========== 视图管线：筛选 → 排序 → 分组 → 渲染 ========== */
function applyView() {
  const rows = sortRows(filterRows(allRows));
  refreshSortArrows();
  renderChips();
  renderStats(rows);
  renderTable(rows);
}

/* ---- 前端筛选：多选字段取「或」，条件间取「且」 ---- */
function filterRows(rows) {
  const f = colFilters;
  return rows.filter(m => {
    if (f.category.length && !f.category.includes(m.category || '')) return false;
    if (f.brand.length && !f.brand.includes(m.brand || '')) return false;
    if (f.package.length && !f.package.includes(m.package || '')) return false;
    if (f.unit.length && !f.unit.includes(m.unit || '')) return false;
    if (f.qtyMin !== null && (m.quantity ?? 0) < f.qtyMin) return false;
    if (f.qtyMax !== null && (m.quantity ?? 0) > f.qtyMax) return false;
    if (f.hasImage !== null && (m.image_path || m.has_image ? 1 : 0) !== f.hasImage) return false;
    if (f.hasDoc !== null && (m.documents && m.documents.length ? 1 : 0) !== f.hasDoc) return false;
    return true;
  });
}

/* ---- 多级排序：按 rules 逐级比较（JS sort 稳定，空值永远垫底） ---- */
function cmpOne(a, b, field, dir) {
  let va = a[field], vb = b[field];
  const ea = va === null || va === undefined || va === '';
  const eb = vb === null || vb === undefined || vb === '';
  if (ea || eb) {   /* 空值垫底（与 Excel 一致），不受升/降影响 */
    if (ea && eb) return 0;
    return ea ? 1 : -1;
  }
  let c;
  if (field === 'quantity') c = (+va) - (+vb);                    // 库存数值比较
  /* 文本按中文排序，numeric:true 开启自然排序：数字段按数值比（1,2,10 而非 1,10,2），
     位号 A1-03/编码 C100 这类含数字文本也能正确排序；created_at 字典序=时间序 */
  else c = String(va).localeCompare(String(vb), 'zh', { numeric: true });
  return dir === 'desc' ? -c : c;
}
function cmpRows(a, b) {
  for (const r of sortRules) {
    const c = cmpOne(a, b, r.field, r.dir);
    if (c) return c;
  }
  return (b.id - a.id);   // 兜底：默认新料在前（与后端 ORDER BY id DESC 一致）
}
function sortRows(rows) { return rows.slice().sort(cmpRows); }

/* ---- 表头点击：三态循环 未排序→升序→降序→还原默认 ---- */
function onSortClick(field) {
  const cur = sortRules.find(r => r.field === field);
  if (!cur) sortRules = [{ field, dir: 'asc' }];
  else if (cur.dir === 'asc') sortRules = [{ field, dir: 'desc' }];
  else sortRules = [];                      // 再点一次还原默认（id 倒序）
  saveView();
  applyView();
}
function refreshSortArrows() {
  document.querySelectorAll('.sort-arrow').forEach(sp => {
    const f = sp.dataset.f;
    const r = sortRules.find(x => x.field === f);
    sp.textContent = r ? (r.dir === 'asc' ? ' ▲' : ' ▼') : ' ↕';
    sp.className = 'sort-arrow' + (r ? ' on' : '');
  });
}

/* ---- 多条件排序弹窗 ---- */
function openSortModal() {
  /* 字段下拉：第一级必选（默认 id 倒序可不选=默认），二/三级可空 */
  const mkOpts = (sel, allowEmpty) => {
    const cur = sel.value;
    sel.innerHTML = (allowEmpty ? '<option value="">（不选）</option>' : '') +
      SORTABLE_FIELDS.map(([f, label]) => `<option value="${f}">${label}</option>`).join('');
    sel.value = cur || (allowEmpty ? '' : 'name');
  };
  ['sort-f1','sort-f2','sort-f3'].forEach((id, i) => mkOpts(document.getElementById(id), i > 0));
  /* 回填当前规则 */
  ['f1','f2','f3'].forEach((n, i) => {
    const r = sortRules[i];
    if (r) {
      document.getElementById('sort-' + n).value = r.field;
      document.querySelector(`input[name="sort-d${i+1}"][value="${r.dir}"]`).checked = true;
    }
  });
  openModal('sort-modal');
}
function applySortModal() {
  const rules = [];
  ['1','2','3'].forEach(i => {
    const f = document.getElementById('sort-f' + i).value;
    if (f) rules.push({ field: f, dir: document.querySelector(`input[name="sort-d${i}"]:checked`).value });
  });
  sortRules = rules;   // 弹窗整体替换（表头点击=单条件，弹窗=多条件）
  saveView();
  closeModal('sort-modal');
  applyView();
}
function clearSort() {
  sortRules = [];
  saveView();
  closeModal('sort-modal');
  applyView();
}

/* ---- 分组 ---- */
function setGroup(f) {
  groupField = f;
  collapsedGroups.clear();   // 换分组维度时折叠状态重置
  saveView();
  applyView();
}
function toggleGroup(key) {
  if (collapsedGroups.has(key)) collapsedGroups.delete(key);
  else collapsedGroups.add(key);
  applyView();
}

/* ---- 筛选弹窗：打开时按当前数据动态生成多选组（去重 + 计数） ---- */
function fillCheckGroup(elId, field) {
  const box = document.getElementById(elId);
  const cnt = {};   // 值 → 行数（空值归入「（未填）」显示）
  allRows.forEach(m => {
    const v = m[field] || '';
    cnt[v] = (cnt[v] || 0) + 1;
  });
  const keys = Object.keys(cnt).sort((a, b) => a.localeCompare(b, 'zh', { numeric: true }));
  box.innerHTML = keys.map(v =>
    `<label class="flt-item"><input type="checkbox" value="${esc(v)}"` +
    `${colFilters[field].includes(v) ? ' checked' : ''}> ${esc(v) || '（未填）'} (${cnt[v]})</label>`
  ).join('') || '<span class="modal-tip">（无数据）</span>';
}
function openFilterModal() {
  document.getElementById('flt-qmin').value = colFilters.qtyMin ?? '';
  document.getElementById('flt-qmax').value = colFilters.qtyMax ?? '';
  document.querySelector(`input[name="flt-img"][value="${colFilters.hasImage ?? ''}"]`).checked = true;
  document.querySelector(`input[name="flt-doc"][value="${colFilters.hasDoc ?? ''}"]`).checked = true;
  fillCheckGroup('flt-category', 'category');
  fillCheckGroup('flt-brand', 'brand');
  fillCheckGroup('flt-package', 'package');
  fillCheckGroup('flt-unit', 'unit');
  openModal('filter-modal');
}
function applyFilterModal() {
  const num = id => {
    const v = document.getElementById(id).value;
    if (v === '') return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  };
  colFilters.qtyMin = num('flt-qmin');
  colFilters.qtyMax = num('flt-qmax');
  const radio = name => {
    const v = document.querySelector(`input[name="${name}"]:checked`).value;
    return v === '' ? null : +v;
  };
  colFilters.hasImage = radio('flt-img');
  colFilters.hasDoc = radio('flt-doc');
  ['category','brand','package','unit'].forEach(f => {
    colFilters[f] = [...document.querySelectorAll(`#flt-${f} input:checked`)].map(i => i.value);
  });
  saveView();
  closeModal('filter-modal');
  applyView();
}
function clearFilters() {
  colFilters = { category: [], brand: [], package: [], unit: [],
                 qtyMin: null, qtyMax: null, hasImage: null, hasDoc: null };
  saveView();
  closeModal('filter-modal');
  applyView();
}
/* 移除单个条件（chips 的 × 点击），按 chip 类型分发 */
function removeFilter(key, val) {
  if (['category','brand','package','unit'].includes(key))
    colFilters[key] = colFilters[key].filter(v => v !== val);
  else if (key === 'qty') { colFilters.qtyMin = null; colFilters.qtyMax = null; }
  else colFilters[key] = null;   // hasImage / hasDoc
  saveView();
  applyView();
}

/* ---- 筛选 chips 行（工具栏下方）：每个启用条件一枚，可单删 ---- */
function renderChips() {
  const f = colFilters;
  const chips = [];
  ['category','brand','package','unit'].forEach(k => {
    f[k].forEach(v => chips.push(
      `<span class="chip-x">${FIELD_LABEL[k]||k}: ${esc(v)||'（未填）'}<b onclick="removeFilter('${k}','${esc(v)}')">×</b></span>`));
  });
  if (f.qtyMin !== null || f.qtyMax !== null)
    chips.push(`<span class="chip-x">库存 ${f.qtyMin ?? '不限'} ~ ${f.qtyMax ?? '不限'}<b onclick="removeFilter('qty')">×</b></span>`);
  if (f.hasImage !== null)
    chips.push(`<span class="chip-x">图片: ${f.hasImage ? '有' : '无'}<b onclick="removeFilter('hasImage')">×</b></span>`);
  if (f.hasDoc !== null)
    chips.push(`<span class="chip-x">手册: ${f.hasDoc ? '有' : '无'}<b onclick="removeFilter('hasDoc')">×</b></span>`);
  const box = document.getElementById('filter-chips');
  box.innerHTML = chips.length
    ? chips.join('') + `<span class="chip-x clear-all" onclick="clearFilters()">清除筛选</span>`
    : '';
  box.style.display = chips.length ? 'flex' : 'none';
}

/* ---- 统计条：条数 + 库存合计（单位不统一时仅提示条数）；达到接口 500 上限时告警 ---- */
function renderStats(rows) {
  const el = document.getElementById('mat-stats');
  let txt = `共 ${rows.length} 项`;
  const units = new Set(rows.map(m => m.unit || ''));
  if (units.size <= 1) {   // 单位统一才合计（个/件混算无意义）
    const total = rows.reduce((s, m) => s + (m.quantity || 0), 0);
    txt += ` · 库存合计 ${total}${units.size === 1 && units.has('') ? '' : ' ' + [...units][0] || ''}`;
  }
  if (allRows.length >= 500) txt += ' · 已达接口上限 500 条';
  el.textContent = txt;
}

/* ---- 渲染：分组时插组头行（含计数/合计/折叠），否则平铺 ---- */
function renderTable(rows) {
  const body = document.getElementById('mat-body');
  if (!groupField) {
    body.innerHTML = rows.map((m, i) => rowHtml(m, i)).join('');
    return;
  }
  /* 分组：按组键聚类，组间组键升序（中文按拼音），组内保持当前排序 */
  const groups = new Map();
  rows.forEach(m => {
    const k = m[groupField] || '（未填）';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  });
  const keys = [...groups.keys()].sort((a, b) => a.localeCompare(b, 'zh', { numeric: true }));
  const colspan = 16;   // 表格列数（含 sticky 出入库列）
  body.innerHTML = keys.map(k => {
    const g = groups.get(k);
    const total = g.reduce((s, m) => s + (m.quantity || 0), 0);
    const open = !collapsedGroups.has(k);
    const head = `<tr class="group-row" onclick="toggleGroup('${esc(k).replace(/'/g, "\\'")}')">
      <td colspan="${colspan}"><span class="toggle">${open ? '▾' : '▸'}</span>
        ${esc(k)} <span class="group-meta">${g.length} 项 · 库存合计 ${total}</span></td></tr>`;
    return head + (open ? g.map((m, i) => rowHtml(m, i)).join('') : '');
  }).join('');
}

/* 单行 HTML（与原渲染逐列一致；新增「分类」列 td） */
function rowHtml(m, i) {
  return `<tr>
    <td>${i + 1}</td>
    <td>${(m.image_path || m.has_image) ? `<img src="/api/materials/${m.id}/image" referrerpolicy="no-referrer" style="width:44px;height:44px;object-fit:contain;cursor:zoom-in"
         title="点击查看大图" onclick="window.open('/api/materials/${m.id}/image')"
         onerror="this.replaceWith(document.createTextNode('—'))">` : '—'}</td>
    <td>${esc(m.name)}</td><td>${esc(m.code||'')}</td>
    <td>${esc(m.model||'')}</td><td>${esc(m.category||'')}</td>
    <td>${esc(m.package||'')}</td><td>${esc(m.brand||'')}</td>
    <td>${m.quantity} ${esc(m.unit||'')}</td><td>${esc(m.warehouse_name||'')}</td>
    <td>${esc(m.location_code||'')}</td>
    <td style="white-space:nowrap">${(m.created_at||'').slice(0,10)}</td>
    <td style="white-space:nowrap">${m.documents && m.documents.length ? m.documents.map(d =>
      `<span class="badge">${d.doc_type === 'datasheet' ? '数据手册' : d.doc_type === 'user_manual' ? '用户手册' : '其他文档'}</span>
       <button class="small" onclick="window.open('/api/documents/${d.id}?mode=preview')">预览</button>
       <button class="small gray" onclick="location.href='/api/documents/${d.id}'">下载</button>
       <button class="small danger" onclick="delDoc(${d.id})">删除</button>`).join('<br>')
      : ''}
      <button class="small" onclick="openDocModal(${m.id})">上传手册</button>
      ${m.code ? `<button class="small" onclick="autoFetchDoc(${m.id}, this)">获取手册</button>` : ''}</td>
    <td style="white-space:nowrap">
      ${m.code && !m.image_path && !m.has_image ? `<button class="small" onclick="fetchImg(${m.id}, this)">获取图片</button>` : ''}
      <button class="small" onclick='editMaterial(${JSON.stringify(m)})'>编辑</button>
      <button class="small danger" onclick="delMaterial(${m.id})">删除</button>
    </td>
    <td class="col-sticky" style="white-space:nowrap">
      <button class="mini-btn in" onclick="openStockModal(${m.id}, '${esc(m.name).replace(/'/g, "\\'")}', ${m.quantity}, 'in')">入库</button>
      <button class="mini-btn out" onclick="openStockModal(${m.id}, '${esc(m.name).replace(/'/g, "\\'")}', ${m.quantity}, 'out')">出库</button>
    </td></tr>`;
}

/* ==================== 就地出入库（sticky 列按钮） ==================== */
let stockMid = 0;
function openStockModal(mid, name, curQty, op) {
  stockMid = mid;
  document.getElementById('stock-m-title').textContent =
    `${op === 'in' ? '入库' : '出库'}：${name}（当前库存 ${curQty}）`;
  document.querySelector(`input[name="stock-op"][value="${op}"]`).checked = true;
  document.getElementById('stock-qty').value = 1;
  document.getElementById('stock-remark').value = '';
  openModal('stock-modal');
}
async function submitStock() {
  const op = document.querySelector('input[name="stock-op"]:checked').value;
  const qty = parseInt(document.getElementById('stock-qty').value, 10);
  if (!qty || qty < 1) { alert('数量必须是大于0的整数'); return; }
  await api(`/api/stock/${op}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ material_id: stockMid, quantity: qty,
                           remark: document.getElementById('stock-remark').value }) });
  closeModal('stock-modal');
  loadMaterials();
}
function openMaterialModal() {
  document.getElementById('mat-modal-title').textContent = '新建物料';
  ['m-id','m-name','m-code','m-model','m-category','m-package','m-brand','m-location','m-lcsc','m-desc']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('m-quantity').value = 0;
  document.getElementById('m-unit').value = '个';
  openModal('mat-modal');
}
function editMaterial(m) {
  document.getElementById('mat-modal-title').textContent = `编辑物料 #${m.id}`;
  document.getElementById('m-id').value = m.id;
  document.getElementById('m-name').value = m.name || '';
  document.getElementById('m-code').value = m.code || '';
  document.getElementById('m-model').value = m.model || '';
  document.getElementById('m-category').value = m.category || '';
  document.getElementById('m-package').value = m.package || '';
  document.getElementById('m-brand').value = m.brand || '';
  document.getElementById('m-quantity').value = m.quantity || 0;
  document.getElementById('m-unit').value = m.unit || '个';
  document.getElementById('m-warehouse').value = m.warehouse_id || '';
  document.getElementById('m-location').value = m.location_code || '';
  document.getElementById('m-lcsc').value = m.lcsc_url || '';
  document.getElementById('m-desc').value = m.description || '';
  openModal('mat-modal');
}
async function saveMaterial() {
  const id = document.getElementById('m-id').value;
  const body = {
    name: document.getElementById('m-name').value.trim(),
    code: document.getElementById('m-code').value.trim(),
    model: document.getElementById('m-model').value.trim(),
    category: document.getElementById('m-category').value.trim(),
    package: document.getElementById('m-package').value.trim(),
    brand: document.getElementById('m-brand').value.trim(),
    quantity: +document.getElementById('m-quantity').value || 0,
    unit: document.getElementById('m-unit').value.trim() || '个',
    warehouse_id: document.getElementById('m-warehouse').value || null,
    location_code: document.getElementById('m-location').value.trim(),
    lcsc_url: document.getElementById('m-lcsc').value.trim(),
    description: document.getElementById('m-desc').value.trim(),
    image_url: window.__lcsc_image || '',
  };
  if (!body.name) { alert('名称必填'); return; }
  if (id) {
    await api(`/api/materials/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  } else {
    await api('/api/materials', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }
  window.__lcsc_image = '';  // 用完清空，避免污染下次手工新建
  closeModal('mat-modal');
  loadMaterials();
}
async function delMaterial(id) {
  if (!confirm('确认删除该物料？')) return;
  await api(`/api/materials/${id}`, { method: 'DELETE' });
  loadMaterials();
}

// ---------- 立创商城 ----------
function openLcscModal() {
  document.getElementById('lcsc-results').innerHTML = '';
  document.getElementById('lcsc-kw').value = '';
  openModal('lcsc-modal');
}
async function lcscSearch() {
  const kw = document.getElementById('lcsc-kw').value.trim();
  if (!kw) return;
  const box = document.getElementById('lcsc-results');
  box.innerHTML = '<p style="color:var(--ink-3);font-size:13px">搜索中，请稍候...</p>';
  try {
    const list = await api(`/api/lcsc/search?q=${encodeURIComponent(kw)}`);
    if (!list.length) {
      box.innerHTML = '<p style="color:var(--ink-3);font-size:13px">未找到结果，请换关键字或直接手工新建。</p>';
      return;
    }
    box.innerHTML = '';
    list.forEach(it => box.appendChild(makeLcscCard(it)));
  } catch (e) {
    box.innerHTML = '<p style="color:var(--ink-3);font-size:13px">搜索失败，请手工新建。</p>';
  }
}
function makeLcscCard(it) {
  const div = document.createElement('div');
  div.className = 'lcsc-card';
  const hasDetail = !!(it.model || it.name);
  div.innerHTML = `
    ${it.image ? `<img src="${esc(it.image)}" onerror="this.style.display='none'">` : ''}
    <div class="info">
      <div class="model">${esc(it.model || it.code)}</div>
      <div class="meta">${esc(it.code)}${it.brand ? ' · ' + esc(it.brand) : ''}${it.package ? ' · ' + esc(it.package) : ''}${it.stock ? ' · 库存' + esc(it.stock) : ''}${it.price ? ' · $' + esc(it.price) : ''}</div>
      ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ''}
    </div>
    <div class="pick">
      ${hasDetail ? '' : `<button class="small" onclick="loadLcscDetail('${it.code}', this)">查看详情</button>`}
      <button class="small" onclick='fillFromLcsc(${JSON.stringify(it)})'>选中新建</button>
    </div>`;
  return div;
}
async function loadLcscDetail(code, btn) {
  const card = btn.closest('.lcsc-card');
  btn.disabled = true;
  btn.textContent = '获取中...';
  try {
    const it = await api(`/api/lcsc/detail?code=${encodeURIComponent(code)}`);
    const div = makeLcscCard(it);
    card.replaceWith(div);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '查看详情';
  }
}
function fillFromLcsc(it) {
  closeModal('lcsc-modal');
  openMaterialModal();
  window.__lcsc_image = it.image || '';  // 保存图片URL，保存物料时后端下载
  document.getElementById('m-name').value = it.name || it.model || it.code;
  document.getElementById('m-code').value = it.code;
  document.getElementById('m-model').value = it.model;
  document.getElementById('m-category').value = it.category || '';
  document.getElementById('m-package').value = it.package || '';
  document.getElementById('m-brand').value = it.brand || '';
  document.getElementById('m-lcsc').value = it.url || '';
  document.getElementById('m-desc').value = it.description || '';
}

// ---------- 手册上传 / 自动获取 ----------
function openDocModal(mid) {
  document.getElementById('doc-mid').textContent = mid;
  document.getElementById('doc-file').value = '';
  openModal('doc-modal');
}
async function uploadDoc() {
  const mid = document.getElementById('doc-mid').textContent;
  const file = document.getElementById('doc-file').files[0];
  if (!file) { alert('请选择文件'); return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('doc_type', document.getElementById('doc-type').value);
  const r = await fetch(`/api/materials/${mid}/documents`, { method: 'POST', body: fd });
  const data = await r.json();
  if (!r.ok) { alert(data.error || '上传失败'); return; }
  closeModal('doc-modal');
  loadMaterials();
}
async function autoFetchDoc(mid, btn) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '下载中...';
  try {
    const data = await api(`/api/materials/${mid}/fetch_datasheet`, { method: 'POST' });
    alert(data.note ? `手册已存在：${data.file_name}` : `手册已下载：${data.file_name}`);
    loadMaterials();
  } catch (e) {
    btn.textContent = old;
    btn.disabled = false;
  }
}
async function delDoc(did) {
  if (!confirm('确认删除该手册文件？')) return;
  await api(`/api/documents/${did}`, { method: 'DELETE' });
  loadMaterials();
}
async function fetchImg(mid, btn) {
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '获取中...';
  try {
    const data = await api(`/api/materials/${mid}/fetch_image`, { method: 'POST' });
    if (!data.note) { /* 新下载成功 */ }
    loadMaterials();
  } catch (e) {
    btn.textContent = old;
    btn.disabled = false;
  }
}

init();
</script>
