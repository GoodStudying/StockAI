<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓库管理 - 个人ERP</title>
<script src="/common.js"></script>
<script>
/* 尽早应用主题，防止刷新时闪回默认配色 */
(function(){var t=localStorage.getItem('theme');if(t&&t!=='classic')document.documentElement.setAttribute('data-theme',t);})();
/* 首屏鉴权门：渲染前先隐藏整页，checkLogin 鉴权通过后由 common.js 显示（未登录不闪首页）；
   兜底 6s 超时自动显示，防接口异常导致页面永远空白 */
document.documentElement.classList.add('auth-pending');
setTimeout(function(){document.documentElement.classList.remove('auth-pending');}, 6000);
</script>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
<div id="nav-mount"><script>/* 解析到即注入，侧栏随首帧出现 */document.currentScript.parentElement.innerHTML = renderNav('/warehouses.html');</script></div>
<main>
  <div class="page-head">
    <h1>仓库管理</h1>
    <span class="sub">多级仓库结构（最多4级）与库内物料</span>
  </div>
  <div class="wh-layout" style="display:flex;gap:16px">
  <div class="panel" style="width:400px;flex-shrink:0">
    <h3 class="pt">仓库结构</h3>
    <div class="toolbar">
      <button onclick="addWarehouse(null)">新建一级库</button>
      <button class="gray" onclick="expandAll()">全部展开</button>
      <button class="gray" onclick="collapseAll()">全部折叠</button>
    </div>
    <div id="tree"></div>
  </div>

  <div class="panel" style="flex:1;min-width:0">
    <h3 class="pt" id="detail-title">库内物料</h3>
    <p style="font-size:12px;color:var(--ink-3);margin-bottom:10px">点击左侧仓库查看该库物料（含子库）</p>
    <div class="table-wrap">
    <table>
      <thead><tr><th>序号</th><th>名称</th><th>编码</th><th>型号</th><th>封装</th><th>品牌</th><th>所在库</th><th>位号</th><th>库存</th></tr></thead>
      <tbody id="wh-mat-body"></tbody>
    </table>
    </div>
  </div>
  </div>
</main>
</div>

<script src="/common.js"></script>
<script>
let warehouses = [];
let currentWid = null;

async function init() {
  const user = await checkLogin();
  if (!user) return;
  await loadWarehouses();
}
async function loadWarehouses() {
  warehouses = await api('/api/warehouses');
  renderTree();
}
let collapsed = {};  // 折叠状态：id -> true

function renderTree() {
  const el = document.getElementById('tree');
  el.innerHTML = '';
  // 同层按仓库名（字母/拼音）升序，与下拉框/物料列表默认排序一致
  const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'zh', { numeric: true });
  const childrenOf = pid => warehouses.filter(w => (w.parent_id || null) === pid).sort(byName);
  function render(list) {
    list.forEach(w => {
      const kids = childrenOf(w.id);
      const isCollapsed = !!collapsed[w.id];
      const div = document.createElement('div');
      div.className = `tree-node indent-${w.level}`;
      div.innerHTML = `
        ${kids.length ? `<span class="toggle" onclick="event.stopPropagation();toggleNode(${w.id})">${isCollapsed ? '▸' : '▾'}</span>` : '<span class="toggle-placeholder"></span>'}
        <span class="badge">L${w.level}</span><span class="name">${esc(w.name)}</span>
        <span class="badge">${w.material_count ?? 0}项</span>
        <span class="ops">
          ${w.level < 4 ? `<button class="small" onclick="event.stopPropagation();addWarehouse(${w.id})">新建子库</button>` : ''}
          <button class="small" onclick="event.stopPropagation();renameWarehouse(${w.id},'${esc(w.name)}')">修改名称</button>
          <button class="small danger" onclick="event.stopPropagation();delWarehouse(${w.id})">删除</button>
        </span>`;
      div.onclick = () => { currentWid = w.id; showWarehouseMaterials(w); };
      el.appendChild(div);
      if (kids.length && !isCollapsed) render(kids);
    });
  }
  render(childrenOf(null));
}
function toggleNode(id) {
  collapsed[id] = !collapsed[id];
  renderTree();
}
function expandAll() { collapsed = {}; renderTree(); }
function collapseAll() {
  // 只折叠有子库的一级库
  warehouses.filter(w => !w.parent_id).forEach(w => collapsed[w.id] = true);
  renderTree();
}

async function addWarehouse(parentId) {
  const name = prompt(parentId ? '输入子库名称：' : '输入一级库名称：');
  if (!name) return;
  await api('/api/warehouses', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, parent_id: parentId }) });
  loadWarehouses();
}
async function renameWarehouse(id, oldName) {
  const name = prompt('修改库名：', oldName);
  if (!name || name === oldName) return;
  await api(`/api/warehouses/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name }) });
  loadWarehouses();
}
async function delWarehouse(id) {
  if (!confirm('删除该库及其所有子库？')) return;
  await api(`/api/warehouses/${id}`, { method: 'DELETE' });
  currentWid = null;
  document.getElementById('wh-mat-body').innerHTML = '';
  document.getElementById('detail-title').textContent = '库内物料';
  loadWarehouses();
}
async function showWarehouseMaterials(w) {
  document.getElementById('detail-title').textContent = `「${w.name}」库内物料（含子库，共 ${w.material_count ?? 0} 项）`;
  const list = await api(`/api/materials?warehouse_id=${w.id}`);  // 默认含子库
  document.getElementById('wh-mat-body').innerHTML = list.length
    ? list.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.name)}</td><td>${esc(m.code||'')}</td>
        <td>${esc(m.model||'')}</td><td>${esc(m.package||'')}</td><td>${esc(m.brand||'')}</td>
        <td>${esc(m.warehouse_name||'')}</td><td>${esc(m.location_code||'')}</td><td>${m.quantity} ${esc(m.unit||'')}</td></tr>`).join('')
    : '<tr><td colspan="9" style="color:var(--ink-3);text-align:center">该库及子库暂无物料</td></tr>';
}

init();
</script>
</body>
</html>
