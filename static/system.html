<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统管理 - 个人ERP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
<div id="nav-mount"></div>
<main>
  <div class="page-head">
    <h1>系统管理</h1>
    <span class="sub">数据库信息 / 备份 / 账户管理</span>
  </div>
  <!-- 数据库管理 -->
  <div class="panel">
    <h3 class="pt">数据库管理</h3>
    <div id="db-info">加载中...</div>
    <div class="toolbar" style="margin-top:14px">
      <button onclick="location.href='/api/db/backup'">备份数据库（下载）</button>
      <button class="gray" onclick="loadDbInfo()">刷新数据</button>
    </div>
    <p style="font-size:12px;color:var(--ink-3)">
      切换到 PostgreSQL：编辑项目根目录 .env，将 DB_TYPE 改为 postgres 并填写 POSTGRES_DSN，重启服务即可。</p>
  </div>

  <!-- 账户管理 -->
  <div class="panel">
    <h3 class="pt">账户管理</h3>
    <div class="toolbar">
      <button onclick="openUserModal()">新建账户</button>
    </div>
    <div class="table-wrap">
    <table>
      <thead><tr><th>序号</th><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="user-body"></tbody>
    </table>
    </div>
  </div>
</main>
</div>

<!-- 新建账户弹窗 -->
<div class="modal-mask" id="user-modal">
  <div class="modal" style="width:400px">
    <h3>新建账户</h3>
    <div class="form-row"><label>用户名 *</label><input id="u-name"></div>
    <div class="form-row"><label>密码 *</label><input id="u-pass" type="password"></div>
    <div class="form-row"><label>角色</label>
      <select id="u-role"><option value="user">普通用户</option><option value="admin">管理员</option></select>
    </div>
    <div class="modal-footer">
      <button class="gray" onclick="closeModal('user-modal')">取消</button>
      <button onclick="saveUser()">保存</button>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
async function init() {
  document.getElementById('nav-mount').innerHTML = renderNav('/system.html');
  const user = await checkLogin();
  if (!user) return;
  loadDbInfo();
  loadUsers();
}
async function loadDbInfo() {
  try {
    const d = await api('/api/db/info');
    document.getElementById('db-info').innerHTML = `
      <div class="info-grid">
        <div class="info-cell"><div class="k">数据库类型</div><div class="v">${d.type}</div></div>
        ${d.type === 'sqlite' ? `<div class="info-cell"><div class="k">文件大小</div><div class="v">${d.size_kb}<small> KB</small></div></div>` : ''}
        <div class="info-cell"><div class="k">仓库数</div><div class="v">${d.warehouses}</div></div>
        <div class="info-cell"><div class="k">物料数</div><div class="v">${d.materials}</div></div>
        <div class="info-cell"><div class="k">手册数</div><div class="v">${d.material_documents}</div></div>
        <div class="info-cell"><div class="k">流水数</div><div class="v">${d.stock_records}</div></div>
        <div class="info-cell"><div class="k">账户数</div><div class="v">${d.users}</div></div>
      </div>
      ${d.type === 'sqlite' ? `<p style="font-size:12px;color:var(--ink-3);margin-top:6px;word-break:break-all">${esc(d.path)}</p>` : ''}`;
  } catch (e) {
    document.getElementById('db-info').textContent = e.message;
  }
}
async function loadUsers() {
  const list = await api('/api/users');
  document.getElementById('user-body').innerHTML = list.map((u, i) => `<tr>
    <td>${i + 1}</td><td>${esc(u.username)}</td>
    <td><span class="badge">${u.role === 'admin' ? '管理员' : '普通用户'}</span></td>
    <td>${u.created_at}</td>
    <td style="white-space:nowrap">
      <button class="small" onclick="resetPass(${u.id})">重置密码</button>
      <button class="small gray" onclick="toggleRole(${u.id},'${u.role}')">切换角色</button>
      <button class="small danger" onclick="delUser(${u.id})">删除</button>
    </td></tr>`).join('');
}
function openUserModal() {
  document.getElementById('u-name').value = '';
  document.getElementById('u-pass').value = '';
  openModal('user-modal');
}
async function saveUser() {
  const body = { username: document.getElementById('u-name').value.trim(),
                 password: document.getElementById('u-pass').value,
                 role: document.getElementById('u-role').value };
  await api('/api/users', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  closeModal('user-modal');
  loadUsers();
}
async function resetPass(uid) {
  const password = prompt('输入新密码：');
  if (!password) return;
  await api(`/api/users/${uid}`, { method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password }) });
  alert('密码已重置');
}
async function toggleRole(uid, role) {
  const newRole = role === 'admin' ? 'user' : 'admin';
  await api(`/api/users/${uid}`, { method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ role: newRole }) });
  loadUsers();
}
async function delUser(uid) {
  if (!confirm('确认删除该账户？')) return;
  await api(`/api/users/${uid}`, { method: 'DELETE' });
  loadUsers();
}

init();
</script>
</body>
</html>
