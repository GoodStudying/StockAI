<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手 - 个人ERP</title>
<script src="/common.js"></script>
<script>
/* 尽早应用主题，防止刷新时闪回默认配色 */
(function(){var t=localStorage.getItem('theme');if(t&&t!=='classic')document.documentElement.setAttribute('data-theme',t);})();
/* 首屏鉴权门：渲染前先隐藏整页，checkLogin 鉴权通过后由 common.js 显示（未登录不闪首页）；
   兜底 6s 超时自动显示，防接口异常导致页面永远空白 */
document.documentElement.classList.add('auth-pending');
setTimeout(function(){document.documentElement.classList.remove('auth-pending');}, 6000);
</script>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
/* ===== 对话式布局：头像 + 左右分侧 + 状态 ===== */
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13px; user-select: none; }
.msg-row.user .avatar { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
.msg-row.assistant .avatar { background: var(--card); border: 1px solid var(--line); }
.msg-main { max-width: min(80%, 840px); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.msg-row.user .msg-main { align-items: flex-end; }
.msg-row.assistant .msg-main { align-items: flex-start; }
/* 气泡自身收缩到内容宽度（inline 级别），避免用户消息被 max-width 撑满整行后提前折行 */
.msg-main .bubble { align-self: auto; width: fit-content; max-width: 100%; }
.msg-main .action-card { align-self: stretch; width: auto; }
.m-meta { font-size: 11px; color: var(--ink-3); white-space: nowrap; padding: 0 4px; }

/* 状态徽标：就绪 / 思考中(呼吸) / 已完成 / 已停止 / 失败 */
.status-chip { margin-left: auto; font-size: 12px; padding: 3px 12px; border-radius: 999px;
  border: 1px solid var(--line-2); color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.status-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.status-chip.thinking { color: var(--accent-deep); border-color: var(--accent); }
.status-chip.thinking .dot { background: var(--accent); animation: pulse 1s infinite; }
.status-chip.done { color: var(--green); border-color: var(--green); }
.status-chip.done .dot { background: var(--green); }
.status-chip.stopped { color: var(--ink-2); }
.status-chip.error { color: var(--red); border-color: var(--red); }
.status-chip.error .dot { background: var(--red); }
@keyframes pulse { 50% { opacity: .25; } }

/* 发送/停止双态按钮 */
#send-btn.stopping { background: var(--red); }

/* AI 回复的 Markdown 轻渲染（表格/代码/加粗） */
.bubble table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
.bubble th, .bubble td { border: 1px solid var(--line-2); padding: 3px 8px; text-align: left; }
.bubble th { background: rgba(128,128,128,.08); }
.bubble pre { background: rgba(128,128,128,.08); border-radius: 6px; padding: 8px 10px;
  overflow-x: auto; font-size: 12px; margin: 6px 0; }
.bubble code { font-family: Consolas, monospace; font-size: .92em;
  background: rgba(128,128,128,.12); padding: 0 4px; border-radius: 4px; }
.bubble pre code { background: none; padding: 0; }

/* 批量确认条：同一消息 pending 卡片 ≥2 张时出现（一次性入库50种不用点50次） */
.batch-ops { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
/* 自动继续开关：批量确认完成后自动发「继续」让 AI 出下一批卡片（大批量分批场景免手动） */
.batch-ops .auto-cont { display: flex; gap: 4px; align-items: center; font-size: 12px;
  color: var(--text-2, #888); cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div class="layout">
<div id="nav-mount"><script>/* 解析到即注入，侧栏随首帧出现 */document.currentScript.parentElement.innerHTML = renderNav('/chat.html');</script></div>
<main>
  <div class="page-head">
    <h1>AI 助手</h1>
    <span class="sub">对话式出入库 / BOM 核对 / 采购管理（写操作需点击卡片确认）</span>
    <span class="status-chip" id="status-chip"><span class="dot"></span><span id="status-text">就绪</span></span>
  </div>

  <div class="panel chat-layout">
    <div class="chat-scroll" id="chat-scroll">
      <div class="chat-empty" id="chat-empty">
        <div class="big">✦</div>
        试试对我说：<br>
        「我现在有哪些库存」<br>
        「最近出入库流水」<br>
        「入库 10 个 C621395」<br>
        「建三个仓库：原材料库、半成品库、成品库」<br>
        「帮我核对这份 BOM：C621395 ×5，103电阻 ×20」<br>
        「把缺料加到采购清单，项目叫测试板V2」
      </div>
      <div class="typing" id="typing"><i></i><i></i><i></i></div>
    </div>
    <!-- 快捷指令：一键填入发送，引导用户用对问法（借鉴参考实现） -->
    <div class="quick-chips">
      <button class="chip" onclick="quickSend(this)">我现在有哪些库存</button>
      <button class="chip" onclick="quickSend(this)">最近出入库流水</button>
      <button class="chip" onclick="quickSend(this)">查一下 100nF 电容的库存</button>
      <button class="chip" onclick="quickSend(this)">列出全部仓库</button>
      <button class="chip" onclick="quickSend(this)">采购清单还有多少没买齐</button>
    </div>
    <div class="chat-input">
      <textarea id="chat-input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"
        oninput="autoGrow(this)" onkeydown="onInputKey(event)"></textarea>
      <button id="send-btn" onclick="onSendBtn()">发送</button>
    </div>
    <div class="chat-hintbar">
      <span id="ai-status"></span>
      <span style="color:var(--ink-3)">AI 思考期间可点「停止」中断</span>
      <a href="#" onclick="clearHistory();return false;" style="color:var(--red)">清空对话</a>
    </div>
  </div>
</main>
</div>

<script>
/* ==================== AI 助手页 ==================== */
let sending = false;
let abortCtrl = null;      // 停止用 AbortController
let oldestId = 0;          // 已加载最早消息 id（向上翻页游标）
const scrollEl = document.getElementById('chat-scroll');

/* 文本框自动增高（最高150px） */
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}
/* Enter 发送 / Shift+Enter 换行 */
function onInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

/* ---------- 对话状态徽标 ---------- */
const chipEl = document.getElementById('status-chip');
const chipText = document.getElementById('status-text');
function setStatus(state, detail) {
  chipEl.className = 'status-chip' + (state !== 'idle' ? ' ' + state : '');
  const map = {
    idle: '就绪',
    thinking: '思考中…',
    done: '已完成' + (detail ? ' · ' + detail : ''),
    stopped: '已停止' + (detail ? ' · ' + detail : ''),
    error: '失败' + (detail ? ' · ' + detail : ''),
  };
  chipText.textContent = map[state] || '就绪';
}

/* ---------- 时间格式化 ---------- */
function fmtTime(s) {
  if (!s || s === '刚刚') return s || '';
  const d = new Date(String(s).replace(' ', 'T'));
  if (isNaN(d)) return s;
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function nowTime() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

/* 卡片类型中文标签（含 v261016.1 新增；旧 type 保留映射，历史卡片照常渲染） */
const TYPE_LABEL = {
  stock_in: '入库', stock_out: '出库',
  create_material: '新建物料', update_material: '修改物料', delete_material: '删除物料',
  create_warehouse: '新建仓库', update_warehouse: '修改仓库', delete_warehouse: '删除仓库',
  add_purchase_items: '导入采购', update_purchase_item: '修改采购项', delete_purchase_item: '删除采购项',
  add_purchase_batch: '登记采购', del_purchase_batch: '删除采购批次',
};

/* AI 回复 Markdown 轻渲染：先 esc 防注入，再支持 表格/代码块/行内代码/加粗/换行。
   （参考实现 ai.html 的 md() 同款能力；模型爱输出小表格，纯文本显示会很难看） */
function mdLite(src) {
  let s = esc(src || '');
  const codes = [];
  s = s.replace(/```[\s\S]*?```/g, m => {
    codes.push('<pre><code>' + m.slice(3, -3).replace(/^\n/, '') + '</code></pre>');
    return '@@CODE' + (codes.length - 1) + '@@';
  });
  // 表格：连续的 | a | b | 行（可选分隔行）
  s = s.replace(/(?:^\|.*\|$(?:\n|$))+/gm, block => {
    const rows = block.trim().split('\n').filter(r => r.trim());
    if (!rows.length) return block;
    const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    const isSep = r => /^\|[\s:|-]+\|$/.test(r.trim());
    let html = '<table>';
    rows.forEach((r, i) => {
      if (isSep(r)) return;
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + cells(r).map(c => '<' + tag + '>' + c + '</' + tag + '>').join('') + '</tr>';
    });
    return html + '</table>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
       .replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/^[ \t]*[-*] /gm, '· ');
  s = s.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  s = s.replace(/@@CODE(\d+)@@/g, (m, i) => codes[+i]);
  return s;
}

/* 渲染一条消息：头像 + 气泡（左右分侧）+ 卡片组 + 时间戳 */
function renderMsg(m, where = 'append') {
  const empty = document.getElementById('chat-empty');
  if (empty) empty.remove();
  const typing = document.getElementById('typing');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (m.role === 'user' ? 'user' : 'assistant');
  row.dataset.id = m.id;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = m.role === 'user' ? '我' : '✦';

  const main = document.createElement('div');
  main.className = 'msg-main';

  const b = document.createElement('div');
  b.className = 'bubble';
  if (m.role === 'user') {
    b.textContent = m.content || '';
  } else {
    /* AI 消息按 Markdown 渲染（已 esc 防注入） */
    b.innerHTML = mdLite(m.content || '（已生成操作卡片）');
  }
  main.appendChild(b);

  (m.actions || []).forEach(a => main.appendChild(renderCard(m.id, a)));
  /* 同一消息 pending 卡片 ≥2 张时附批量确认条（一键全部确认/取消） */
  const pendN = (m.actions || []).filter(a => a.status === 'pending').length;
  if (pendN >= 2) main.appendChild(batchBar(m.id, pendN));

  const meta = document.createElement('div');
  meta.className = 'm-meta';
  let metaTxt = (m.role === 'user' ? '我' : 'AI') + ' · ' + (m.created_at ? fmtTime(m.created_at) : '');
  /* token 用量：仅 assistant 消息有（服务端按整条对话 tool loop 全程累加） */
  if (m.usage && m.usage.total_tokens) {
    metaTxt += ` · ${m.usage.total_tokens.toLocaleString()} tokens` +
      `（入 ${m.usage.prompt_tokens.toLocaleString()} / 出 ${m.usage.completion_tokens.toLocaleString()}）`;
  }
  meta.textContent = metaTxt;
  main.appendChild(meta);

  row.appendChild(avatar);
  row.appendChild(main);
  if (where === 'append') scrollEl.insertBefore(row, typing);
  else scrollEl.insertBefore(row, scrollEl.firstChild);   // prepend（历史向上加载）
  return row;
}

/* 渲染操作卡片（四态） */
function renderCard(msgId, a) {
  const card = document.createElement('div');
  card.className = 'action-card ' + a.status;
  card.dataset.aid = a.id;
  const label = TYPE_LABEL[a.type] || a.type;
  let html = `<div class="a-title">${esc(a.title || label)}<span class="a-type">${label}</span></div>`;
  html += `<div class="a-detail">${esc(JSON.stringify(a.params, null, 1))}</div>`;
  if (a.status === 'pending') {
    html += `<div class="a-ops">
      <button class="btn" style="background:var(--green);color:var(--green-ink);border:none" onclick="execAction(${msgId},'${a.id}',false)">确认执行</button>
      <button class="btn" style="background:var(--btn-gray-bg);color:var(--ink-2);border:1px solid var(--line-2)" onclick="execAction(${msgId},'${a.id}',true)">取消</button>
    </div>`;
  } else {
    const res = a.result || {};
    let txt;
    if (a.status === 'executed') {
      const parts = ['✓ 已执行'];
      if (res.discarded_stock !== undefined) {
        /* 删除物料：名称 + 清掉的库存 */
        parts.push(`已删除「${res.name || '物料'}」` + (res.discarded_stock > 0 ? `，清空库存 ×${res.discarded_stock}` : ''));
      } else {
        if (res.name !== undefined && res.level !== undefined)
          parts.push(`仓库「${res.name}」（${res.level} 级）`);   /* create_warehouse */
        if (res.quantity !== undefined) parts.push(`现库存 ${res.quantity}`);
        else if (res.material_id !== undefined) parts.push(`物料 #${res.material_id}`);
        if (res.warehouse_id !== undefined && res.level === undefined)
          parts.push(`已挂到仓库 #${res.warehouse_id}`);          /* stock_in 挂库 */
        if (res.created !== undefined) parts.push(`新建 ${res.created} 项 / 合并 ${res.merged} 项`);
      }
      if (res.note) parts.push(`（${res.note}）`);
      txt = parts.join('，');
    } else {
      txt = a.status === 'cancelled' ? '已取消' : ('✗ 失败：' + (res.error || '未知错误'));
    }
    html += `<div class="a-ops"><span class="res">${esc(txt)}${a.executed_at ? ' · ' + esc(a.executed_at) : ''}</span></div>`;
  }
  card.innerHTML = html;
  return card;
}

/* 确认/取消卡片：成功后用服务端返回的最新状态原地替换卡片 */
async function execAction(msgId, actionId, cancel) {
  if (!cancel && !confirm('确认执行该操作？')) return;
  const card = document.querySelector(`.action-card[data-aid="${actionId}"]`);
  if (card) card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const r = await api('/api/chat/execute', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message_id: msgId, action_id: actionId, cancel }),
    });
    if (card) card.replaceWith(renderCard(msgId, r.action));
    refreshBatchBar(msgId);   /* pending 数量变化，同步批量条 */
  } catch (e) {
    /* 失败信息已 alert；按钮恢复（库存不足保持 pending 可重试） */
    if (card) card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

/* ---------- 批量确认/取消（同一条消息的全部 pending 卡片） ---------- */
/* 批量确认条：数量由调用方显式传入（首屏来自消息数据，刷新来自 DOM，批量来自响应） */
/* 「自动继续」勾选状态存 localStorage 全站共享：勾一次后续批量条都带默认勾选 */
function batchBar(msgId, n) {
  const bar = document.createElement('div');
  bar.className = 'batch-ops';
  const autoOn = localStorage.getItem('chat_auto_continue') === '1';
  bar.innerHTML =
    `<button class="btn" style="background:var(--green);color:var(--green-ink);border:none" ` +
    `onclick="execBatch(${msgId},false)">✓ 全部确认（${n} 张）</button>` +
    `<button class="btn" style="background:var(--btn-gray-bg);color:var(--ink-2);border:1px solid var(--line-2)" ` +
    `onclick="execBatch(${msgId},true)">全部取消</button>` +
    `<label class="auto-cont" title="批量确认全部成功后，自动发送「继续」让 AI 生成下一批卡片">` +
    `<input type="checkbox" ${autoOn ? 'checked' : ''} ` +
    `onchange="localStorage.setItem('chat_auto_continue', this.checked ? '1' : '0')">自动继续</label>`;
  return bar;
}

/* 按当前 pending 数量重画/移除批量条（单卡确认后调用） */
function refreshBatchBar(msgId) {
  const row = document.querySelector(`.msg-row[data-id="${msgId}"]`);
  if (!row) return;
  row.querySelectorAll('.batch-ops').forEach(el => el.remove());
  const n = row.querySelectorAll('.action-card.pending').length;
  if (n >= 2) {
    const main = row.querySelector('.msg-main');
    main.insertBefore(batchBar(msgId, n), main.querySelector('.m-meta'));
  }
}

/* 批量执行：{message_id, all: true, cancel?}；服务端逐张执行返回整组卡片 + summary */
async function execBatch(msgId, cancel) {
  if (!cancel) {
    const n = document.querySelectorAll(`.msg-row[data-id="${msgId}"] .action-card.pending`).length;
    if (!confirm(`确认一次性执行本消息全部 ${n} 张待确认卡片？\n（单张失败不影响其他卡片）`)) return;
  }
  const row = document.querySelector(`.msg-row[data-id="${msgId}"]`);
  /* 重画前记住「自动继续」勾选状态（整组重画会把批量条连同勾选框一起移除） */
  const autoCont = !!(row && row.querySelector('.batch-ops .auto-cont input')?.checked);
  if (row) row.querySelectorAll('.batch-ops button, .action-card.pending button')
    .forEach(b => b.disabled = true);
  try {
    const r = await api('/api/chat/execute', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message_id: msgId, all: true, cancel }),
    });
    /* 服务端返回该消息全部卡片最新状态：整组重画（卡片 + 批量条） */
    const main = row.querySelector('.msg-main');
    main.querySelectorAll('.action-card, .batch-ops').forEach(el => el.remove());
    const frag = document.createDocumentFragment();
    r.actions.forEach(a => frag.appendChild(renderCard(msgId, a)));
    const pendN2 = r.actions.filter(a => a.status === 'pending').length;
    if (pendN2 >= 2) frag.appendChild(batchBar(msgId, pendN2));
    main.insertBefore(frag, main.querySelector('.m-meta'));
    /* 结果摘要：全部成功悄悄带过；有保留/失败才弹窗提醒 */
    const s = r.summary || {};
    if (cancel) { setStatus('done', `已批量取消 ${s.cancelled || 0} 张`); return; }
    if (s.held || s.failed) {
      alert(`批量执行完成：成功 ${s.executed || 0} 张` +
        (s.held ? `，保留待确认 ${s.held} 张（库存不足等，可处理后重试）` : '') +
        (s.failed ? `，失败 ${s.failed} 张（详见卡片）` : ''));
    } else {
      setStatus('done', `批量执行 ${s.executed || 0} 张全部成功`);
      /* 自动继续：勾选且全部成功时，自动发「继续」让 AI 出下一批卡片。
         有保留/失败（库存不足等）时不自动发——需人工先处理异常卡片，避免 AI 重复建卡 */
      if (autoCont && (s.executed || 0) > 0 && !sending) {
        const input = document.getElementById('chat-input');
        input.value = '继续'; autoGrow(input);
        send();
      }
    }
  } catch (e) {
    /* 失败已 alert；按钮恢复 */
    if (row) row.querySelectorAll('.batch-ops button, .action-card.pending button')
      .forEach(b => b.disabled = false);
  }
}

/* 快捷指令：点击直接发送 */
function quickSend(btn) {
  if (sending) return;
  document.getElementById('chat-input').value = btn.textContent.trim();
  send();
}

/* 发送/停止双态按钮 */
function onSendBtn() {
  if (sending) { stopGenerating(); return; }
  send();
}
function stopGenerating() {
  if (abortCtrl) abortCtrl.abort();
}

/* 发送期间锁定输入：思考中禁止新发（可点停止中断） */
function setSendingUI(on) {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  input.readOnly = on;
  btn.textContent = on ? '停止' : '发送';
  btn.classList.toggle('stopping', on);
}

/* 发送消息 */
async function send() {
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message || sending) return;
  sending = true;
  abortCtrl = new AbortController();
  const t0 = Date.now();
  input.value = ''; autoGrow(input);
  setSendingUI(true);
  setStatus('thinking');
  renderMsg({ id: 0, role: 'user', content: message, created_at: nowTime() });
  document.getElementById('typing').classList.add('on');
  scrollToBottom();
  try {
    const r = await api('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
      signal: abortCtrl.signal,
    });
    renderMsg({ id: r.message_id, role: 'assistant', content: r.content,
                created_at: nowTime(), actions: r.actions, usage: r.usage });
    setStatus('done', ((Date.now() - t0) / 1000).toFixed(1) + 's');
  } catch (e) {
    if (e && e.name === 'AbortError') {
      /* 已停止：服务端可能仍在处理，本次结果不展示，刷新后可看 */
      renderMsg({ id: 0, role: 'assistant',
                  content: '⏹ 已停止生成。（服务端可能仍在处理本条消息，刷新页面可见完整结果。）',
                  created_at: nowTime() });
      setStatus('stopped', ((Date.now() - t0) / 1000).toFixed(1) + 's');
    } else {
      /* 错误已 alert；失败消息也已在服务端落库，刷新可见 */
      setStatus('error', '详见提示');
    }
  } finally {
    document.getElementById('typing').classList.remove('on');
    sending = false;
    abortCtrl = null;
    setSendingUI(false);
    scrollToBottom();
    input.focus();
  }
}

function scrollToBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }

/* 向上翻页：滚到顶部 40px 内加载更早消息 */
scrollEl.addEventListener('scroll', async () => {
  if (scrollEl.scrollTop > 40 || !oldestId || loadingMore) return;
  loadingMore = true;
  const prevH = scrollEl.scrollHeight;
  try {
    const r = await api(`/api/chat/history?before_id=${oldestId}&limit=30`);
    /* ★ 逆序 prepend：接口返回旧→新，逐条插到顶部会颠倒批内顺序，
       必须从最新往最旧插，批内才能保持 旧在上·新在下 */
    for (let i = r.messages.length - 1; i >= 0; i--) renderMsg(r.messages[i], 'prepend');
    if (!r.has_more) oldestId = 0;
    /* 保持视口贴在原内容位置（不被顶走） */
    scrollEl.scrollTop = scrollEl.scrollHeight - prevH;
  } catch (e) {}
  loadingMore = false;
});
let loadingMore = false;

async function clearHistory() {
  if (!confirm('确认清空当前账号的全部对话记录？此操作不可恢复。')) return;
  await api('/api/chat/history', { method: 'DELETE' });
  location.reload();
}

/* 初始化：登录检查 → AI 状态 → 历史加载 */
(async function init() {
  const user = await checkLogin();
  if (!user) return;
  try {
    const st = await api('/api/ai/status');
    document.getElementById('ai-status').textContent = st.configured
      ? `AI 已就绪 · 模型 ${st.model}` : 'AI 未配置（管理员请在 系统管理 页配置 AI 接口）';
  } catch (e) {}
  try {
    const r = await api('/api/chat/history?limit=30');
    /* ★ 首屏用 append 顺序渲染（旧→新）；此前误用 prepend 导致重开页面时顺序整个颠倒 */
    r.messages.forEach(m => renderMsg(m, 'append'));
    if (r.messages.length) oldestId = r.messages[0].id;
    if (!r.has_more) oldestId = 0;
    scrollToBottom();
  } catch (e) {}
  document.getElementById('chat-input').focus();
})();
</script>
