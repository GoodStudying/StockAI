<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 个人ERP</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="logo">E</div>
    <h2>个人ERP管理系统</h2>
    <p class="tag">物料 · 仓库 · 出入库</p>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
    <p class="login-hint">默认账户 admin / admin123（首次登录后请修改）</p>
  </div>
</div>
<script src="/common.js"></script>
<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    await api('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password }) });
    location.href = '/';
  } catch (e) {}
}
</script>
</body>
</html>
