<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 个人ERP</title>
<link rel="stylesheet" href="/style.css">
<script>
/* 尽早应用主题，防止刷新时闪回默认配色 */
(function(){var t=localStorage.getItem('theme');if(t&&t!=='classic')document.documentElement.setAttribute('data-theme',t);})();
</script>
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="logo">E</div>
    <h2>个人ERP管理系统</h2>
    <p class="tag">物料 · 仓库 · 出入库</p>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
    <p class="login-hint" id="default-hint" style="display:none">默认账户 admin / admin123（首次登录后请修改）</p>
    <div class="theme-switch" style="padding-top:14px">
      <span class="theme-dot" data-theme="classic" title="经典主题" onclick="switchTheme('classic')">◐</span>
      <span class="theme-dot" data-theme="light" title="洁净主题" onclick="switchTheme('light')">○</span>
      <span class="theme-dot" data-theme="dark" title="暗夜主题" onclick="switchTheme('dark')">●</span>
    </div>
    <!-- 部署版本标记：每次发版更新此号，登录页看到它=线上已是该版本（排查部署不生效用） -->
    <p style="margin-top:12px;font-size:12px;opacity:.45;text-align:center">部署版本 v261014.4</p>
  </div>
</div>
<script src="/common.js"></script>
<script>
/* 默认密码提示：仅当 admin 仍是默认密码时显示，改密后自动消失 */
fetch('/api/default_admin_exists').then(r => r.json()).then(d => {
  if (d.default_exists) document.getElementById('default-hint').style.display = '';
}).catch(() => {});
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    await api('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password }) });
    location.href = '/';
  } catch (e) {}
}
</script>
</body>
</html>
