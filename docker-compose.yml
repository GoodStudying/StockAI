# 个人ERP · Docker 部署配置（飞牛 fnOS / 群晖通用）
# 数据库使用宿主机已有的 postgres 容器（ERP_DB 库，宿主机端口 54321）
# 本文件只启动 ERP 应用
# 用法：docker compose up -d --build（或 fnOS Docker 图形界面创建项目）
services:
  erp:
    build: .
    container_name: personal-erp
    restart: unless-stopped      # NAS 重启后自动拉起
    ports:
      - "54322:5000"             # NAS局域网访问端口
    environment:
      - TZ=Asia/Shanghai
      - DB_TYPE=postgres
      # 走宿主机映射地址连接 postgres：host.docker.internal = NAS 宿主机，端口用映射的 54321
      # 若 NAS 防火墙拦截，可把 host 换成 NAS 局域网 IP（如 192.168.1.10）
      - POSTGRES_DSN=host=host.docker.internal port=54321 dbname=ERP_DB user=postgres password=改成你的密码
      # ---------- 网页一键更新（GitHub）----------
      - GITHUB_REPO=Liaojianwei8/AP_ERP
      # 私有仓库必填：GitHub Settings → Developer settings → Fine-grained tokens
      # 只勾选 AP_ERP 仓库 + Contents:Read-only，泄露风险极小
      - GITHUB_TOKEN=填你的Token
      # NAS 访问 GitHub 不稳时取消注释走加速前缀
      # - GITHUB_PROXY=https://gh-proxy.com
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 内核 NAS 必需，让该域名指向宿主机
