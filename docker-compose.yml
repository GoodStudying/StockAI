# 个人ERP · 飞牛 fnOS / Docker 部署配置
# 用法：docker compose up -d --build
services:
  # ---------- PostgreSQL 数据库（内容全部存这里，含手册/图片BLOB） ----------
  db:
    image: postgres:16-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_2024_change_me   # 部署时务必改密码
      TZ: Asia/Shanghai
    volumes:
      - ./pgdata:/var/lib/postgresql/data      # 数据库持久化（备份=pgdata 文件夹）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- ERP 应用 ----------
  erp:
    build: .
    container_name: personal-erp
    restart: unless-stopped      # NAS 重启后自动拉起
    ports:
      - "5800:5000"              # NAS局域网访问端口，冲突可改 5801:5000
    volumes:
      - ./data:/app/data         # 兼容 sqlite 模式的挂载（postgres 模式不用）
    environment:
      - TZ=Asia/Shanghai
      - DB_TYPE=postgres
      # 密码与上面 db 服务保持一致；容器间用服务名 db 互连
      - POSTGRES_DSN=host=db port=5432 dbname=erp user=erp password=erp_2024_change_me
    depends_on:
      db:
        condition: service_healthy

  # ---------- 外网访问（可选）：Cloudflare Tunnel ----------
  # 前置条件：一个托管在 Cloudflare 的域名，并已在 Cloudflare Zero Trust
  # 面板创建隧道拿到 TOKEN（cloudflared tunnel login 后按提示操作）
  # 取消下面注释并填入 TOKEN 即可外网访问 https://erp.你的域名.com
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: erp-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token 你的隧道TOKEN
  #   depends_on:
  #     - erp
  #   # 隧道指向在 Cloudflare 面板配置：Service 类型 HTTP，URL 填 erp:5000
