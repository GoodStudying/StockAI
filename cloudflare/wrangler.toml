# Cloudflare Worker 配置
# 部署方式见 cloudflare/README.md（网页导入 GitHub 仓库部署）
name = "stockai"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# 静态资源：托管仓库根目录的 static/（前端 5 个页面零改动上云）
# 默认行为即多页应用所需：静态文件命中直接返回，未命中（如 /api/*）进入 Worker 路由
assets = { directory = "../static", binding = "ASSETS" }

# D1 数据库绑定（binding 名必须是 DB，代码里 env.DB 引用）
# ★ 部署前必改：在 Cloudflare 控制台创建 D1（名字 erp），把下面 database_id 换成网页显示的真实 ID
[[d1_databases]]
binding = "DB"
database_name = "erp"
database_id = "bfba57af-5c8b-41f6-94b4-f30ad465b2af"

# 环境变量说明（都在网页 Worker → Settings → Variables and Secrets 里配置，不写在代码仓库）：
#   WORKER_SECRET  会话 JWT 签名密钥（必配，随机 32 位以上字符串，Type 选 Secret）
#   API_TOKEN      /api/v1 开放接口令牌（可选，多个用英文逗号分隔，供 Cherry Studio/MCP 调用）
#   AI_MAX_LLM_ROUNDS  AI 单条消息最大 LLM 轮次（可选，默认 20）
#   AI_MAX_TOOL_CALLS  AI 单条消息最大工具调用数=一次最多生成的卡片张数（可选，默认 50）
